# Pushing a tag like v0.1.0 builds the release archives, records build
# provenance for them, and publishes a GitHub release with SHA256SUMS.
# The release notes are that version's section of CHANGELOG.md.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Verify a downloaded archive came from this workflow:
#   gh attestation verify fung_0.1.0_linux_amd64.tar.gz --repo tunarider/fung
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # sign the provenance
  attestations: write # store the provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: check the tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>"; exit 1 ;;
          esac
      - name: test
        run: go test ./...
      - name: release notes
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" CHANGELOG.md > notes.md
      - name: build
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "fung ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
