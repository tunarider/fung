# Runs the same gate as a local commit (CLAUDE.md): gofmt, vet, tests,
# plus the race detector. tests/fmt_test.go also runs `fung fmt --check`
# over the repository's .fung files, and tests/install_test.go runs
# install.sh against a fake release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./internal/... ./cmd/...

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: toolchain
        run: rustup show active-toolchain
      # Crate allowlist (deny.toml). One OS is enough: the lock file and
      # advisory database do not depend on the platform.
      - name: cache cargo-deny and cargo-audit
        if: matrix.os == 'ubuntu-latest'
        id: audit-tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo-audit-tools
          key: audit-tools-deny-0.20.2-audit-0.22.2-${{ runner.os }}
      - name: install cargo-deny and cargo-audit
        if: matrix.os == 'ubuntu-latest' && steps.audit-tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.cargo-audit-tools cargo-deny@0.20.2 cargo-audit@0.22.2
      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        run: ~/.cargo-audit-tools/bin/cargo-deny check
      - name: cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: ~/.cargo-audit-tools/bin/cargo-audit audit
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        env:
          FUNG_REQUIRE_PARITY: "1"
        run: cargo test
      - name: test (release)
        env:
          FUNG_REQUIRE_PARITY: "1"
        run: cargo test --release
