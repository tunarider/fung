[package]
name = "fung-vm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
fung-front = { path = "../fung-front" }
# Go-semantics regular expressions (native/regex_go.rs). The patterns
# handed to the engine spell every class out as code point ranges and use
# no \p, \w or (?i), so the crates' Unicode tables are not needed.
regex = { version = "1", default-features = false, features = ["std", "perf"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std"] }
# TLS client connections (`_native.net` `connect(tls: true)`, 4d spec,
# section 1): ring for the cryptography, no logging. The operating
# system's roots (or SSL_CERT_FILE / SSL_CERT_DIR) through
# rustls-native-certs.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
